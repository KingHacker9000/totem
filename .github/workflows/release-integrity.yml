name: Release integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check integrity implementation formatting
        run: pnpm exec biome check scripts/release-integrity.mjs scripts/release-integrity.node-test.mjs scripts/release-archive.mjs scripts/release-archive.node-test.mjs scripts/release-candidate.mjs scripts/release-candidate.node-test.mjs scripts/release-reproducibility.mjs scripts/release-reproducibility.node-test.mjs
      - name: Test detached integrity, archive, candidate, and reproducibility validators
        run: node --test scripts/release-integrity.node-test.mjs scripts/release-archive.node-test.mjs scripts/release-candidate.node-test.mjs scripts/release-reproducibility.node-test.mjs
      - name: Prove bundle reproducibility across clean worktrees
        run: pnpm release:bundle:reproducibility
      - name: Build and verify public bundle integrity
        run: |
          pnpm release:bundle:build
          node scripts/release-integrity.mjs generate
          node scripts/release-integrity.mjs verify
      - name: Create, verify, and extract release archive
        run: |
          pnpm release:archive:create
          pnpm release:archive:verify
          pnpm release:archive:smoke
      - name: Bind and verify final release candidate identity
        run: |
          pnpm release:candidate:generate
          pnpm release:candidate:verify
      - name: Upload exact public release handoff set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: totem-public-release-handoff
          path: |
            dist/release/totem-public/
            dist/release/totem-public.integrity.json
            dist/release/totem-public.tar.gz
            dist/release/totem-public.candidate.json
          if-no-files-found: error
          # The generated bundle is already fail-closed privacy/integrity validated;
          # preserve legitimate dotfiles exactly across the artifact boundary.
          include-hidden-files: true
          retention-days: 1

  artifact-handoff:
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download public release handoff into fresh path
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: totem-public-release-handoff
          path: dist/handoff
      - name: Verify transferred public release bytes
        run: |
          test -f dist/handoff/totem-public.integrity.json
          test -f dist/handoff/totem-public.tar.gz
          test -f dist/handoff/totem-public.candidate.json
          test -f dist/handoff/totem-public/release-manifest.json
          node scripts/release-integrity.mjs verify \
            --bundle dist/handoff/totem-public \
            --manifest dist/handoff/totem-public.integrity.json
          node scripts/release-archive.mjs verify \
            --bundle dist/handoff/totem-public \
            --archive dist/handoff/totem-public.tar.gz
          node scripts/release-candidate.mjs verify \
            --bundle dist/handoff/totem-public \
            --integrity dist/handoff/totem-public.integrity.json \
            --archive dist/handoff/totem-public.tar.gz \
            --candidate dist/handoff/totem-public.candidate.json
