name: Release integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check integrity implementation formatting
        run: pnpm exec biome check scripts/release-integrity.mjs scripts/release-integrity.node-test.mjs scripts/release-archive.mjs scripts/release-archive.node-test.mjs scripts/release-reproducibility.mjs scripts/release-reproducibility.node-test.mjs
      - name: Test detached integrity, archive, and reproducibility validators
        run: node --test scripts/release-integrity.node-test.mjs scripts/release-archive.node-test.mjs scripts/release-reproducibility.node-test.mjs
      - name: Prove bundle reproducibility across clean worktrees
        run: pnpm release:bundle:reproducibility
      - name: Build and verify public bundle integrity
        run: |
          pnpm release:bundle:build
          node scripts/release-integrity.mjs generate
          node scripts/release-integrity.mjs verify
      - name: Create, verify, and extract release archive
        run: |
          pnpm release:archive:create
          pnpm release:archive:verify
          pnpm release:archive:smoke
