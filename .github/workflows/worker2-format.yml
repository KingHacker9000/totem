name: Worker2 branch formatter
on:
  push:
    branches:
      - worker2/t927-release-config-contract
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker2/t927-release-config-contract
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Worker2"
          git config user.email "worker2@users.noreply.github.com"
          git add config/release-config.json scripts/release-config.mjs scripts/release-config.node-test.mjs scripts/credential-free-startup.mjs
          git commit -m "style(release): apply canonical formatting"
          git push origin HEAD:worker2/t927-release-config-contract
