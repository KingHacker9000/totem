name: T934 Format Capture
on:
  push:
    branches:
      - feat/t934-decommission-lifecycle
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm exec biome format --write deploy/pi/decommission.mjs deploy/pi/decommission.test.mjs package.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t934-canonical-format
          path: |
            deploy/pi/decommission.mjs
            deploy/pi/decommission.test.mjs
            package.json
          if-no-files-found: error
