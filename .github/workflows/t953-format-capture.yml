name: T953 formatter capture
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format T953 sources
        run: pnpm exec biome format --write scripts/pinned-repository-checkout.mjs scripts/pinned-repository-checkout.node-test.mjs
      - name: Upload formatted T953 sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t953-formatted-sources
          path: |
            scripts/pinned-repository-checkout.mjs
            scripts/pinned-repository-checkout.node-test.mjs
          if-no-files-found: error
          retention-days: 1
