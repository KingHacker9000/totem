name: T902 format once

on:
  push:
    branches:
      - chatgpt/t902-contribution-host

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/t902-contribution-host
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit deterministic formatter output and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t902-format-once.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply repository formatter for T902"
          git push origin HEAD:chatgpt/t902-contribution-host
