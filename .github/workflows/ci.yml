name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.12.0, 24.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Upload generated lockfile
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.18.0'
        uses: actions/upload-artifact@v4
        with:
          name: t106-pnpm-lock
          path: pnpm-lock.yaml
      - run: pnpm check
      - run: pnpm build
