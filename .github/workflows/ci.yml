name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.20.0, 24.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release toolchain contract and effective runtime
        run: pnpm release:toolchain:runtime
      - name: Validate release configuration contract
        run: pnpm release:config:check
      - name: Validate public repository-family declaration
        run: pnpm release:repos:check
      - name: Validate public repository-family remote drift
        if: runner.os == 'Linux' && matrix.node == '22.20.0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:repos:check:remote
      - name: Validate public repository-family clean checkouts
        if: runner.os == 'Linux' && matrix.node == '22.20.0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:repos:validate
      - name: Validate public workflow supply-chain policy
        shell: bash
        run: |
          workflow_root="$RUNNER_TEMP/totem-workflow-policy"
          node scripts/pinned-repository-checkout.mjs \
            --root "$workflow_root" \
            --repo KingHacker9000/totem-hardware \
            --repo KingHacker9000/totem-extension-sdk \
            --repo KingHacker9000/totem-theme-sdk \
            --repo KingHacker9000/totem-base-extensions \
            --repo KingHacker9000/totem-base-themes \
            --repo KingHacker9000/totem-agent-providers \
            --repo KingHacker9000/totem-registry
          args=(--repo .)
          for repo in \
            totem-hardware \
            totem-extension-sdk \
            totem-theme-sdk \
            totem-base-extensions \
            totem-base-themes \
            totem-agent-providers \
            totem-registry
          do
            args+=(--repo "$workflow_root/$repo")
          done
          node scripts/workflow-actions.mjs "${args[@]}"
          node scripts/workflow-permissions.mjs "${args[@]}"
          node scripts/workflow-trust.mjs "${args[@]}"
          node scripts/workflow-shell-injection.mjs "${args[@]}"
          node scripts/workflow-checkout-auth.mjs "${args[@]}"
      - name: Validate public release documentation drift
        shell: bash
        run: |
          docs_root="$RUNNER_TEMP/totem-release-docs"
          node scripts/pinned-repository-checkout.mjs \
            --root "$docs_root" \
            --repo KingHacker9000/totem-extension-sdk \
            --repo KingHacker9000/totem-theme-sdk \
            --repo KingHacker9000/totem-base-extensions \
            --repo KingHacker9000/totem-base-themes \
            --repo KingHacker9000/totem-agent-providers \
            --repo KingHacker9000/totem-registry
          args=(--repo .)
          for repo in \
            totem-extension-sdk \
            totem-theme-sdk \
            totem-base-extensions \
            totem-base-themes \
            totem-agent-providers \
            totem-registry
          do
            args+=(--repo "$docs_root/$repo")
          done
          node scripts/release-docs.mjs "${args[@]}"
      - name: Validate artifact-specific third-party release manifest
        shell: bash
        run: |
          manifest="$RUNNER_TEMP/totem-third-party-manifest.json"
          node scripts/third-party-manifest.mjs generate --output "$manifest"
          node scripts/third-party-manifest.mjs verify --output "$manifest"
      - name: Audit production dependency advisories
        if: runner.os == 'Linux' && matrix.node == '22.20.0'
        run: pnpm release:dependencies:audit
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - run: pnpm build
      - name: Validate credential-free startup
        run: pnpm release:config:smoke
      - name: Build and verify deterministic public release bundle
        run: |
          pnpm release:bundle:build
          pnpm release:bundle:verify
      - name: Enforce public release artifact footprint
        run: pnpm release:footprint:check
      - name: Validate isolated public release artifact
        if: runner.os == 'Linux' && matrix.node == '22.20.0'
        run: node scripts/release-artifact-smoke.mjs --bundle dist/release/totem-public
      - name: Scan public release artifact content boundary
        run: pnpm release:artifact:scan
      - name: Generate and verify deterministic CycloneDX release SBOM
        run: |
          pnpm release:sbom:generate
          pnpm release:sbom:verify
      - name: Validate source-to-artifact release provenance
        shell: bash
        run: |
          provenance="totem-provenance-ci.json"
          node scripts/release-provenance.mjs generate \
            --output "$provenance" \
            --artifact dist/release/totem-public \
            --build-command "pnpm build && pnpm release:bundle:build" \
            --profile ci-production
          node scripts/release-provenance.mjs verify --output "$provenance"
          rm "$provenance"
      - name: Validate Pi self-test host-independent path
        shell: bash
        run: |
          export TOTEM_STATE_DIR="$RUNNER_TEMP/totem-self-test-state"
          node deploy/pi/self-test.mjs --offline --json > "$RUNNER_TEMP/totem-pi-self-test.json"
          node -e 'const r=require(process.argv[1]); if(r.schema!=="totem.pi-self-test/v1"||r.overall!=="PASS"||r.counts.FAIL!==0) process.exit(1)' "$RUNNER_TEMP/totem-pi-self-test.json"
      - name: Validate pinned Phase 2 extension integration
        shell: bash
        run: |
          git clone https://github.com/KingHacker9000/totem-base-extensions.git "$RUNNER_TEMP/totem-base-extensions"
          git -C "$RUNNER_TEMP/totem-base-extensions" checkout 00a5b98e18f024740da417d573ea0c3c02bc355a
          git clone https://github.com/KingHacker9000/totem-extension-sdk.git "$RUNNER_TEMP/totem-extension-sdk"
          git -C "$RUNNER_TEMP/totem-extension-sdk" checkout 916607a23a7a5905e0d675a1f451402b495ec3e1
          pnpm --filter @totem/core exec tsx scripts/phase2-integration.ts "$RUNNER_TEMP/totem-base-extensions" "$RUNNER_TEMP/totem-extension-sdk"
      - name: Validate pinned public base-theme host integration
        shell: bash
        run: |
          theme_root="$RUNNER_TEMP/totem-theme-host-integration"
          node scripts/pinned-repository-checkout.mjs \
            --root "$theme_root" \
            --repo KingHacker9000/totem-base-themes
          revision="$(git -C "$theme_root/totem-base-themes" rev-parse HEAD)"
          test "$revision" = "d07a33ad68e7837febf369f57813870df8110982"
          pnpm --filter @totem/core exec tsx scripts/theme-integration.ts \
            "$theme_root/totem-base-themes" \
            "$revision"
      - name: Validate pinned public base-extension host integration
        shell: bash
        run: |
          extension_root="$RUNNER_TEMP/totem-extension-host-integration"
          node scripts/pinned-repository-checkout.mjs \
            --root "$extension_root" \
            --repo KingHacker9000/totem-base-extensions
          revision="$(git -C "$extension_root/totem-base-extensions" rev-parse HEAD)"
          test "$revision" = "6844e5b4bbc0c4b369a24e43c3ca5202e1685312"
          pnpm --filter @totem/core exec tsx scripts/base-extension-integration.ts \
            "$extension_root/totem-base-extensions" \
            "$revision"
