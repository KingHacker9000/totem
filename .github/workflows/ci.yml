name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.20.0, 24.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Validate Pi self-test host-independent path
        shell: bash
        run: |
          export TOTEM_STATE_DIR="$RUNNER_TEMP/totem-self-test-state"
          node deploy/pi/self-test.mjs --offline --json > "$RUNNER_TEMP/totem-pi-self-test.json"
          node -e 'const r=require(process.argv[1]); if(r.schema!=="totem.pi-self-test/v1"||r.overall!=="PASS"||r.counts.FAIL!==0) process.exit(1)' "$RUNNER_TEMP/totem-pi-self-test.json"
      - name: Validate pinned Phase 2 extension integration
        shell: bash
        run: |
          git clone https://github.com/KingHacker9000/totem-base-extensions.git "$RUNNER_TEMP/totem-base-extensions"
          git -C "$RUNNER_TEMP/totem-base-extensions" checkout 00a5b98e18f024740da417d573ea0c3c02bc355a
          git clone https://github.com/KingHacker9000/totem-extension-sdk.git "$RUNNER_TEMP/totem-extension-sdk"
          git -C "$RUNNER_TEMP/totem-extension-sdk" checkout 916607a23a7a5905e0d675a1f451402b495ec3e1
          pnpm --filter @totem/core exec tsx scripts/phase2-integration.ts "$RUNNER_TEMP/totem-base-extensions" "$RUNNER_TEMP/totem-extension-sdk"
