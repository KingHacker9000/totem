name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.12.0, 24.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair Kysely 0.29 migration imports
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node == '24.18.0'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/storage/src/index.ts')
          text = path.read_text()
          old = '''import {
            Kysely,
            Migrator,
            SqliteDialect,
            type Migration,
            type MigrationProvider,
          } from "kysely";'''
          new = '''import { Kysely, SqliteDialect } from "kysely";
          import {
            Migrator,
            type Migration,
            type MigrationProvider,
          } from "kysely/migration";'''
          if old not in text:
              raise SystemExit('expected Kysely import block not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/storage/src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Use Kysely 0.29 migration entrypoint"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: pnpm check
      - run: pnpm build
