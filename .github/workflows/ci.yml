name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22.20.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/t925-release-provenance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize T925 files with pinned Biome
        shell: bash
        run: |
          pnpm exec biome format --write scripts/release-provenance.mjs scripts/release-provenance.node-test.mjs package.json
          if ! git diff --quiet -- scripts/release-provenance.mjs scripts/release-provenance.node-test.mjs package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/release-provenance.mjs scripts/release-provenance.node-test.mjs package.json
            git commit -m "style(release): apply pinned Biome formatting"
            git push origin HEAD:chatgpt/t925-release-provenance
          fi
