name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.12.0, 24.18.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format T106 files
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.node == '24.18.0'
        shell: bash
        run: |
          pnpm format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/tasks packages/storage
          if ! git diff --cached --quiet; then
            git commit -m "Format T106 task storage packages"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: pnpm check
      - run: pnpm build
