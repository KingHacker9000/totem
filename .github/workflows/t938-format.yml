name: T938 format
on:
  push:
    branches:
      - feat/t938-release-sbom-v2
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write scripts/release-sbom.mjs scripts/release-sbom.node-test.mjs package.json
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Totem CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/release-sbom.mjs scripts/release-sbom.node-test.mjs package.json
          git commit -m "style(release): apply repository Biome formatting"
          git push origin HEAD:feat/t938-release-sbom-v2
