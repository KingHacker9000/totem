name: T936 artifact smoke
on:
  push:
    branches: [t936-release-artifact-smoke]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned formatter on branch
        shell: bash
        run: |
          pnpm format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/release-artifact-smoke.mjs docs/RELEASE_ARTIFACT_SMOKE.md .github/workflows/ci.yml
            git commit -m "style: apply pinned formatter for T936"
            git push
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:bundle:build
      - run: pnpm release:bundle:verify
      - run: node scripts/release-artifact-smoke.mjs --bundle dist/release/totem-public
