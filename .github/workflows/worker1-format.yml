name: Worker1 Format Capture

on:
  push:
    branches:
      - chatgpt/t601-management-dashboard

permissions:
  contents: read

jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format apps/dashboard/src/OperatorConsole.tsx apps/dashboard/src/main.tsx --write
      - uses: actions/upload-artifact@v4
        with:
          name: worker1-formatted-dashboard
          path: |
            apps/dashboard/src/OperatorConsole.tsx
            apps/dashboard/src/main.tsx
