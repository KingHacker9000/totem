name: T112 format helper

on:
  push:
    branches:
      - chatgpt/t112-dashboard-tasks

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[t112-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/t112-dashboard-tasks
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write apps/core/src/app.ts apps/core/src/app.test.ts apps/core/src/main.ts apps/dashboard/src/App.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/core/src/app.ts apps/core/src/app.test.ts apps/core/src/main.ts apps/dashboard/src/App.tsx
          git commit -m "style: format T112 files [t112-format]"
          git push
