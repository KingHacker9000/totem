name: T916 check diagnostics

on:
  push:
    branches:
      - chatgpt/t916-pi-readiness

permissions:
  contents: read

jobs:
  check-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture pnpm check output
        shell: bash
        run: |
          set +e
          pnpm check > t916-check.log 2>&1
          code=$?
          echo "$code" > t916-check-exit.txt
          cat t916-check.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: t916-check-diagnostic
          path: |
            t916-check.log
            t916-check-exit.txt
