name: T904 format artifact

on:
  push:
    branches:
      - chatgpt/t904-live-resume

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write apps/core/src/realProviders.ts scripts/live-validation.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet -- apps/core/src/realProviders.ts scripts/live-validation.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/src/realProviders.ts scripts/live-validation.mjs
          git commit -m "style: apply Biome formatting for T904"
          git push origin HEAD:chatgpt/t904-live-resume
